<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid AI Data Cleaner</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Hybrid AI Data Cleaner</h1>
        
        <!-- Step 1: Upload CSV -->
        <h2>1. Upload your Data</h2>
        <label for="csv-file" class="file-upload-label">Choose CSV File</label>
        <input type="file" id="csv-file" accept=".csv">
        <span id="file-name">No file selected</span>
        
        <!-- Step 2: High-level Goal -->
        <h2>2. Describe Your Cleaning Goal</h2>
        <textarea id="prompt-input" placeholder="e.g., Clean up the price column by removing currency symbols and make it a number. Also, standardize the product categories."></textarea>
        <button id="generate-steps-btn" disabled>Generate Cleaning Steps</button>
        
        <!-- Step 3: Review and Edit Steps -->
        <h2>3. Review & Edit AI-Generated Steps</h2>
        <div id="steps-container">
            <p>Generated steps will appear here...</p>
        </div>
        <button id="apply-cleaning-btn" disabled>Apply Cleaning & Show Preview</button>
        
        <!-- Step 4: Preview Cleaned Data -->
        <h2>4. Preview Cleaned Data</h2>
        <div id="data-preview">
            <p>A preview of the cleaned data will appear here.</p>
        </div>

        <div id="message-area"></div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
